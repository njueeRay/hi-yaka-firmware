name: HiYaKa product core

on:
  pull_request:
    paths:
      - "main/yaka/**"
      - "tests/yaka_host/**"
      - "main/CMakeLists.txt"
      - "main/application.cc"
      - "main/audio/audio_service.*"
      - "main/audio/codecs/box_audio_codec.*"
      - "main/ota.*"
      - "main/boards/chatchat/hi-yaka/**"
      - "partitions/hi-yaka-16m.csv"
      - "config/hi-yaka-assurance.json"
      - "scripts/hi_yaka_assurance.py"
      - "scripts/hi_yaka_evidence.py"
      - "scripts/tests/test_hi_yaka_assurance.py"
      - "scripts/tests/test_hi_yaka_evidence.py"
      - ".github/workflows/yaka-product-core.yml"
  push:
    branches:
      - main
    paths:
      - "main/yaka/**"
      - "tests/yaka_host/**"
      - "main/CMakeLists.txt"
      - "main/application.cc"
      - "main/audio/audio_service.*"
      - "main/audio/codecs/box_audio_codec.*"
      - "main/ota.*"
      - "main/boards/chatchat/hi-yaka/**"
      - "partitions/hi-yaka-16m.csv"
      - "config/hi-yaka-assurance.json"
      - "scripts/hi_yaka_assurance.py"
      - "scripts/hi_yaka_evidence.py"
      - "scripts/tests/test_hi_yaka_assurance.py"
      - "scripts/tests/test_hi_yaka_evidence.py"
      - ".github/workflows/yaka-product-core.yml"

permissions:
  contents: read

jobs:
  host-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Configure host tests
        run: cmake -S tests/yaka_host -B build/yaka_host -DCMAKE_BUILD_TYPE=Release
      - name: Build host tests
        run: cmake --build build/yaka_host --parallel 2
      - name: Run host tests
        run: ctest --test-dir build/yaka_host --output-on-failure
      - name: Validate board selection contract
        run: python -m unittest scripts.tests.test_hi_yaka_board scripts.tests.test_hi_yaka_assurance scripts.tests.test_hi_yaka_evidence -v

  hi-yaka-firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: espressif/idf:v6.1
    steps:
      - uses: actions/checkout@v7
      - name: Compile all pre-board hardware adapters
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          python scripts/build.py chatchat/hi-yaka \
            --name hi-yaka-lab \
            --language zh-CN \
            --wake-word disabled
          mkdir -p artifacts
          cp build/xiaozhi.bin artifacts/hi-yaka-lab.bin
          cp build/generated_assets.bin artifacts/hi-yaka-lab-assets.bin
          cp sdkconfig artifacts/hi-yaka-lab.sdkconfig
      - name: Build HiYaKa with ESP-IDF 6.1
        shell: bash
        run: |
          source "$IDF_PATH/export.sh"
          idf.py --version
          python scripts/build.py chatchat/hi-yaka \
            --name hi-yaka \
            --language zh-CN \
            --wake-word disabled
      - name: Gate resources and generate traceability manifest
        shell: bash
        env:
          SOURCE_SHA: ${{ github.sha }}
          CI_REPOSITORY: ${{ github.repository }}
          CI_RUN_ID: ${{ github.run_id }}
        run: |
          source "$IDF_PATH/export.sh"
          idf.py size --format json2 > build/hi-yaka-size.json
          python scripts/hi_yaka_assurance.py resources \
            --partition partitions/hi-yaka-16m.csv \
            --app-bin build/xiaozhi.bin \
            --size-json build/hi-yaka-size.json \
            --output build/hi-yaka-resource-report.json
          python scripts/hi_yaka_assurance.py provenance \
            --partition partitions/hi-yaka-16m.csv \
            --app-bin build/xiaozhi.bin \
            --merged-bin build/merged-binary.bin \
            --sdkconfig sdkconfig \
            --resource-report build/hi-yaka-resource-report.json \
            --source-sha "$SOURCE_SHA" \
            --idf-version "$(idf.py --version)" \
            --ci-repository "$CI_REPOSITORY" \
            --ci-run-id "$CI_RUN_ID" \
            --output build/hi-yaka-provenance.json
          sha256sum \
            build/xiaozhi.bin \
            build/merged-binary.bin \
            build/hi-yaka-resource-report.json \
            build/hi-yaka-provenance.json \
            > build/SHA256SUMS
      - name: Upload traceable HiYaKa candidate
        uses: actions/upload-artifact@v7
        with:
          name: hi-yaka-${{ github.sha }}
          path: |
            build/xiaozhi.bin
            build/merged-binary.bin
            build/hi-yaka-size.json
            build/hi-yaka-resource-report.json
            build/hi-yaka-provenance.json
            build/SHA256SUMS
            artifacts/hi-yaka-lab.bin
            artifacts/hi-yaka-lab-assets.bin
            artifacts/hi-yaka-lab.sdkconfig
            sdkconfig
            partitions/hi-yaka-16m.csv
          if-no-files-found: error
